    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 2h8M0 6h8" stroke="#7fa1c7" stroke-width="1" opacity=".3"/>
    </pattern>
    <pattern id="photoGrid" width="12" height="12" patternUnits="userSpaceOnUse">

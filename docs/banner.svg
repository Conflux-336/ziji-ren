<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">自己人 · 年底礼品分拣</title>
  <desc id="bannerDesc">奶油色纸张与木桌背景上，放着一张工牌、一叠年货礼盒和一枚写着“唯一依据 签约主体”的红章。</desc>

